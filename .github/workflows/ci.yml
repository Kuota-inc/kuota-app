name: Security & Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-verify:
    name: Typecheck, Audit & Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Check for accidental committed secrets
        working-directory: .
        run: |
          if git grep -E "(sk_live_|AIzaSy|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY)" -- ':!*.md' ':!*.txt' ':!.github/*'; then
            echo "Posible secreto detectado en el repositorio."
            exit 1
          fi

      - name: Install backend dependencies
        run: npm ci

      - name: Audit high/critical dependencies
        run: npm audit --omit=dev --audit-level=high || true

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run full security & integration test suite
        run: npm test
