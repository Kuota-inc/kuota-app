name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tipos, pruebas en PGlite y Postgres 16, auditoría)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Base efímera del runner, solo para pruebas.
          POSTGRES_PASSWORD: ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Pruebas en PGlite
        run: npm test
      - name: Pruebas en Postgres 16
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:ci_only@localhost:5432/postgres
      - name: Auditoría de dependencias (producción)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  frontend:
    name: Frontend (tipos, lint, build, auditoría)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npx vite build
      - name: Auditoría de dependencias (producción)
        run: npm audit --omit=dev --audit-level=high

  # Despliegue a staging en Cloud Run. Queda apagado hasta configurar en el repo
  # (Settings > Variables) GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER y
  # GCP_DEPLOY_SA. Ver docs/BACKEND-GCP.md.
  deploy-staging:
    name: Desplegar backend a staging (Cloud Run)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/kuota/backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Construir y publicar la imagen
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
      - name: Migraciones (job con el usuario dueño)
        run: |
          gcloud run jobs deploy kuota-migrate --image "$IMAGE" --region ${{ vars.GCP_REGION }} \
            --command node --args dist/db/migrate-cli.js \
            --set-cloudsql-instances ${{ vars.GCP_SQL_INSTANCE }} \
            --set-secrets DATABASE_URL=kuota-migrate-database-url:latest --quiet
          gcloud run jobs execute kuota-migrate --region ${{ vars.GCP_REGION }} --wait
      - name: Desplegar el servicio
        run: |
          gcloud run deploy kuota-backend --image "$IMAGE" --region ${{ vars.GCP_REGION }} \
            --set-cloudsql-instances ${{ vars.GCP_SQL_INSTANCE }} \
            --set-secrets DATABASE_URL=kuota-core-database-url:latest,PAYMENTS_DATABASE_URL=kuota-payments-database-url:latest,KUOTA_LINK_SIGNING_KEY=kuota-link-signing-key:latest,KUOTA_WEBHOOK_SECRET=kuota-webhook-secret:latest,KUOTA_SESSION_SECRET=kuota-session-secret:latest,KUOTA_PIN_PEPPER=kuota-pin-pepper:latest,KUOTA_ADMIN_TOKEN=kuota-admin-token:latest \
            --set-env-vars KUOTA_PAY_BASE_URL=${{ vars.KUOTA_PAY_BASE_URL }},KUOTA_CORS_ORIGINS=${{ vars.KUOTA_CORS_ORIGINS }} \
            --allow-unauthenticated --quiet
