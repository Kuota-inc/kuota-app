<span>Continuar</span>
</button>

    </button>

<script>
  (function () {
    let pin = [];
    const maxDigits = 6;
    const slots = document.querySelectorAll('#pin-slots-container .slot');
    const submitBtn = document.getElementById('btn-submit');
    const deleteBtn = document.getElementById('key-delete');
    const keypadButtons = document.querySelectorAll('.keypad-btn');

    function updateView() {
      slots.forEach((slot, idx) => {
        const dot = slot.querySelector('.dot');
        if (idx < pin.length) {
          slot.classList.add('bg-surface-white', 'shadow-md');
          slot.style.outlineColor = '#1A3BB0';
          dot.classList.remove('bg-transparent', 'scale-75');
          dot.classList.add('bg-primary-container', 'scale-100');
        } else {
          slot.classList.remove('shadow-md');
          slot.style.outlineColor = '#AFC5F6';
          dot.classList.remove('bg-primary-container', 'scale-100');
          dot.classList.add('bg-transparent', 'scale-75');
        }
      });

      if (pin.length === maxDigits) {
        submitBtn.removeAttribute('disabled');
        submitBtn.classList.remove('bg-disabled-track', 'text-disabled-content');
        submitBtn.classList.add('bg-primary-container', 'text-on-primary', 'shadow-md');
        
        // Brief playful feedback flash
        slots.forEach((slot) => {
          slot.classList.add('bg-surface-container');
          setTimeout(() => slot.classList.remove('bg-surface-container'), 250);
        });
      } else {
        submitBtn.setAttribute('disabled', 'true');
        submitBtn.classList.add('bg-disabled-track', 'text-disabled-content');
        submitBtn.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-md');
      }
    }

    keypadButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        if (pin.length < maxDigits) {
          const val = btn.getAttribute('data-value');
          pin.push(val);
          updateView();
        }
      });
    });

    deleteBtn.addEventListener('click', () => {
      if (pin.length > 0) {
        pin.pop();
        updateView();
      }
    });
  })();
</script></main>
